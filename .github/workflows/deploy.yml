name: CI and VPS deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: englishroulette-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: englishroulette_tests
          POSTGRES_DB: englishroulette_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U englishroulette_tests"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENGLISHROULETTE_TEST_CONNECTION: Host=localhost;Port=5432;Database=englishroulette_tests;Username=englishroulette_tests
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EnglishRoulette.sln --locked-mode
      - run: dotnet build EnglishRoulette.sln --configuration Release --no-restore
      - run: dotnet test EnglishRoulette.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet format EnglishRoulette.sln --verify-no-changes --no-restore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  image:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: reference
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy immutable release via pinned SSH host
        env:
          APP_IMAGE: ${{ needs.image.outputs.reference }}
          RELEASE_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/englishroulette' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          VPS_REGISTRY_USER: ${{ vars.VPS_REGISTRY_USER }}
          VPS_REGISTRY_TOKEN: ${{ secrets.VPS_REGISTRY_TOKEN }}
        run: python3 scripts/deploy_vps.py

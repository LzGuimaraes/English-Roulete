name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EnglishRoulette.sln --locked-mode
      - run: dotnet build EnglishRoulette.sln --configuration Release --no-restore
      - run: dotnet test EnglishRoulette.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet format EnglishRoulette.sln --verify-no-changes --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
